[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-tareas-upb"
version = "0.1.0"
description = "Organizador local de tareas académicas para estudiantes de la UPB"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-playwright",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
